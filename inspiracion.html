<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Nombre de la ventana-->
    <title>MindBox</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#088dec">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));</script>
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

<!--Esto enlaza el CSS con este archivo-->

<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/tipo.css">
<link rel="stylesheet" href="./css/reset.css">
<link rel="stylesheet" href="./css/componentes.css">
<link rel="stylesheet" href="./css/formularios.css">
<link rel="stylesheet" href="./css/styles.css">

</head>


<body>
    <!--Encierra el contenido que va a llevar la web-->
    <header id="cabecera" data-activo="inspiracion"></header>


 <main class="main">

    <section>

   
    <h1>Añadir una inspiración</h1>

    


    <!--Aquí comienza una sección con flexbox-->

     
    <section class="container">


    <div class="formulario">    
        <form action="" method="get" enctype="text/plain">
            <div class="formulario__campo">
            <label for="TítuloInspo">Título</label>
            <input id="TítuloInspo" type="text" name="TítuloInspo" placeholder="Escribe el título"/>
            </div>

            <div class="formulario__campo">
                <label for="desc">Comentario</label>
                <textarea id="desc" name="desc" cols="60" rows="10" placeholder="Escribe el texto que te inspira..."></textarea>
            </div>

            <div class="formulario__campo">
                <label for="busqueda-imagen">Busca una imagen en Unsplash</label>
                <div class="busqueda-imagen">
                    <input id="busqueda-imagen" name="busquedaImagen" type="search" placeholder="Por ejemplo: playa, montaña..." autocomplete="off">
                    <button class="btn btn--primary" id="buscar-imagen" type="button">Buscar</button>
                </div>
                <p class="estado-busqueda" id="estado-busqueda" role="status" aria-live="polite"></p>
                <div class="resultados-paginados">
                    <div class="resultados-imagenes" id="resultados-imagenes" aria-label="Resultados de imágenes"></div>
                    <nav class="paginacion-imagenes" id="paginacion-imagenes" aria-label="Paginación de resultados" hidden>
                        <button class="btn btn--link" id="pagina-anterior" type="button">Anterior</button>
                        <span id="numero-pagina" aria-live="polite"></span>
                        <button class="btn btn--link" id="pagina-siguiente" type="button">Siguiente</button>
                    </nav>
                </div>
            </div>

        <p class="mensaje-error">Faltan campos por rellenar</p>

    <button class="btn btn--primary" type="submit">Guardar</button>

    </form>

    </div> 

      </section>

    </section>   

    <h1>Últimas Inspiraciones</h1>


 <section class="container" id="lista-inspiraciones"></section>


    </main>

<div class="footer" id="pie"></div>



    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
        <script src="./js/formulario.js"></script>
    
    <!-- Vue 3 desde CDN: expone el objeto global Vue. -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="./js/componentes.js"></script>
    <script src="./js/inspiraciones.js"></script>
    <script>
        // Monta la lista en #lista-inspiraciones (Vue sustituye su contenido) y guarda la app para que formulario.js llame a recargar().
        window.listaApp = Vue.createApp(ListaInspiraciones).mount('#lista-inspiraciones');
    </script>
</body>
</html>
